<!DOCTYPE html>
<html>
<head>
  <style>

    body{
      margin:0;
    }

    a{
      text-decoration: none;
    }

    ul{
      padding:15px;
      height:50px;
      text-align: right;
      margin:0;
    }

    li{
      display:inline-block;
      height:50px;
      padding: 0 15px;
    }

    /* ❌ head {} remove panninom */

    #head{
      float:left;
      margin:10px;
    }

    ul{
      float:right;
    }

    .clr::after{
      content:"";
      display:block;
      clear:both;
    }

  </style>
</head>

<body>
<header>
  <div class="clr">
    <h1 id="head">Mywebsite</h1>

    <ul>
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Offer</a></li>
    </ul>  
  </div>
</header>
</body>
</html>
