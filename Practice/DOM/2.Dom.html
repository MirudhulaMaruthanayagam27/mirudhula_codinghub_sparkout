<!DOCTYPE html>
<html>
  <head>
    <title>DOM</title>
  </head>
<body>
  <button>hello</button>
  <script>

    //get 1st btn element
    console.log(document.querySelector('button'));
    //output:<buttton>hello</button>,also for body
    
    //get innerhtml
    console.log(document.querySelector('button').innerHTML);

    //change html
    document.querySelector('button').innerHTML='Button';

    document.body.innerHTML='hi';
    document.title='dom';

    console.log(document.title);
    document.title='changed this';

    document.body.innerHTML='<button>Good</button>';
  </script>
</body>
</html>
