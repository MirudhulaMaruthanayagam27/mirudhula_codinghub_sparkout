<!DOCTYPE html>
<html>
<head>
  <style>

    section{
      height:100vh;
    }
    .blue{
      background-color: blue;
    }
    .red{
      background-color:red ;
    }
    .green{
      background-color: green;
    }
    header,footer{
      color: whitesmoke;
      font-size: 59px;
      text-align: center;
      padding: 2px;
    }
    header{
      position:sticky;
      top:0;
    }
    footer{
      position:fixed;
      bottom: 0;
      text-align: center;
      background-color: aqua;
      width:100%; /*or --give position:sticky*/
    }
    dhuddu{
      background-color: aqua;
      top:30%;
      left:0;
      position: fixed;

    }
    dhuddu1{
      background-color: aqua;
      top:30%;
      left:0;
      position: fixed;
      color:blue;
      font-size:inherit;
      /*if needed=z-index:1;*/

    }

  </style>
</head>
<body>
  <button class="dhuddu">Dhuddu</button>
  <button class="dhuddu1">Dhuddu</button>
  <section id="one">
    <header class="blue">Earn</header>
    <h2>One</h2>
  </section>

   <section id="two">
    <header class="red">Grow</header>
    <h2>Two</h2>
  </section>

   <section id="three">
    <header class="green">Earn</header>
    <h2>Three</h2>
  </section>

  <footer>
    <a href="#one">One</a>
    <a href="#two">two</a>
    <a href="#three">three</a>
  </footer>
</body>
</html>
