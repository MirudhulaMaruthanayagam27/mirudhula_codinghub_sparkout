<!DOCTYPE html>
<html>
  <head>
    <style>
      *{
        margin: 0;
        top:0;
        box-sizing: border-box;
      }
      body{
        min-height: 100vh;
        padding: 20px;
      }
      .container{
        border:2px solid red;
        max-width:800px;
        min-height:600px;
        margin-inline:auto;
        
        display:flex;
        justify-content: center; 
        gap:1rem;
        /*space-around,gap,center,spce-evenly,flex-start,flex-end*/
        align-items: center; /*flex-end,flex-start*/
        /*flex dirc-row /colum*/
        flex-wrap: wrap;
        flex-direction: row;

        

      }
      .box{
        background-color:black;
        color: white;
        padding:0.5rem;
        /*min-width: 100px; */ /*or*/ height:100px;
        font-size: 2rem;
        flex:0 1 250px;

      }
    </style>
  </head>
<body>
  <main class="container">
    <div class="box">1

    </div>
    <div class="box">2

    </div>
    <div class="box">3

    </div>
    <div class="box">4

    </div>
    <div class="box">5

    </div>
    <div class="box">6

    </div>
  </main>
</body>
</html>
