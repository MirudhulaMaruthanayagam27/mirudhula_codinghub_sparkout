<!DOCTYPE html>
<html>
  <head>
    <style>

      *{
        margin:0;
        padding:0;
        box-sizing: border-box;
      }
      body{
        min-height: 100vh;
      }
      .box{
        background-color: black;
        color: aliceblue;
        font-size: 2rem;
        padding:0.5rem; 
      }
      .container{
        display: grid;
        /*grid-auto-flow:column;*/
        grid-template-columns:1fr 2fr;
        grid-auto-rows:200px;


      }
    </style>
  </head>
<body>

  <main class="container">
    <div class="box">1</div>
    <div class="box">1</div>
    <div class="box">1</div>
    <div class="box">1</div>
  </main>
</body>
</html>
