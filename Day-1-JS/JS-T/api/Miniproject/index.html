<!DOCTYPE html>
<html>
  <head>
    <title>Asynchronous</title>
    <style>
      h1{
        text-align: center;
      }
      #searchbar{
        display: block;
        margin:0 auto 20px auto;
        width: 350px;
        font-size: 18px;
        padding: 8px;
      }
      #productcontainer{
        display: grid;
        gap:20px;
        margin-top:10px;
        grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
      }
      .productcard{
        border: 2px solid black;
        padding: 10px;
        text-align: center;
        background-color: aqua;
      }
      .productcard img{
        width: 100px;
        height: 100px;
        object-fit: contain;
        margin-bottom: 10px;
      }
      #spinner{
        display: none;
        text-align: center;
        margin:20px 0;
      }
      #spinner img{
        width: 50px;
        height: 50px;
      }

    </style>
  </head>
<body>
  <h1>API Fetch</h1>
  
  <input type="text" id="searchbar" placeholder="Search products">

  <div id="productcontainer"></div>

  <div id="spinner">
  <img src="https://i.gifer.com/ZZ5H.gif" alt="Loading...">
  </div>
  <script>

    const searchbar=document.getElementById("searchbar");
    const productcontainer=document.getElementById("productcontainer");
    const spinner=document.getElementById("spinner");

    //initialize 

    let products=[];
    let loading=false;
    let filterproducts=[];

    //api fetch

    async function fetchProducts(){
      spinner.style.display="block";
      try{
        const res=await fetch("https://fakestoreapi.com/products");
        if(!res.ok){
          throw new ("network error"); 
        }
        products=await res.json();
        filterproducts=[...products];
        displaynextbatch();
      }
      catch(err){
        alert("Failed loading product list");
      }
      finally{
        spinner.style.display="none";
      }
    }

    //display as batch 

    function displaynextbatch(){
      filterproducts.forEach(product => {
        const create_div=document.createElement("div");
        create_div.className="productcard";
        create_div.innerHTML=`
        <img src="${product.image}" alt="${product.title}">
        <h3>${product.title}</h3>
        <p>Price: $${product.price}</p>
        <p>Category: ${product.category}</p>`;
        productcontainer.appendChild(create_div);
      });
      index+=batch;
    }
    
    //add eventlistener and search and filter products
    searchbar.addEventListener("input",()=> {
      const val=searchbar.value.toLowerCase();
      productcontainer.innerHTML="";
      index=0;
      filterproducts=
      products.filter(
        p => p.title.toLowerCase().includes(val) ||
        p.category.toLowerCase().includes(val)
    );
    displaynextbatch();
    });

    fetchProducts();

  </script>
</body>
</html>
