<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Portfolio</title>
  <style>
    body { font-family: Arial; text-align: center; background: #f0f0f0; margin: 0; padding: 0; }
    header { background: #4CAF50; color: white; padding: 30px 0; }
    section { margin: 40px auto; width: 80%; padding: 20px; background: white; border-radius: 10px; }
    #map { height: 300px; margin: 20px auto; border: 2px solid #4CAF50; border-radius: 10px; }
    button, input { padding: 10px; font-size: 16px; margin-top: 10px; }
    p { font-size: 18px; margin-top: 10px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

  <header>
    <h1>Mirudhula Portfolio</h1>
    <p>Frontend Developer | API Enthusiast</p>
  </header>

  <section>
    <h2>Contact Me (Search Location)</h2>
    <input type="text" id="locationInput" placeholder="Enter city or address">
    <button id="searchLocationBtn">Show Location</button>
    <div id="map"></div>
    <p id="locationInfo"></p>
  </section>

  <section>
    <h2>Fun Corner: Random Joke</h2>
    <button id="getJokeBtn">Get a Joke</button>
    <p id="jokeSetup"></p>
    <p id="jokePunchline"></p>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
