<!--Create an input box and button. When the button is clicked, 
check if the entered number is even or odd and display the result using DOM.-->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student List</title>
</head>
<body>

    <h2>Student Names</h2>
    <input type="text" id="value" placeholder="enter value">
    
    <button id="evenodd">Click me!</button>
    
    <p id="result"></p>
  
    
    <script>
      
      let btn=document.getElementById("evenodd");
      
      btn.onclick=function()
      {
        
        let val=Number(document.getElementById("value").value);
        
        let res="";
        
        if(val%2==0){
          res=val + " is even";
        }
        
        else{
          
          res=val + "odd";
        }
      
      document.getElementById("result").innerHTML=res;
      };
      
      
      
    </script>
</body>
</html>
